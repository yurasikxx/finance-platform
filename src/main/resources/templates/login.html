<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Вход в систему')}"></head>
<body>
<div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show alert-flash" role="alert">
    <i class="bi bi-exclamation-triangle-fill"></i>
    Неверный email или пароль
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show alert-flash" role="alert">
    <i class="bi bi-check-circle-fill"></i>
    Вы успешно вышли из системы
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<div th:if="${param.registered}" class="alert alert-success alert-dismissible fade show alert-flash" role="alert">
    <i class="bi bi-check-circle-fill"></i>
    Регистрация успешна! Войдите в систему
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <h3 class="text-center mb-4">Вход в систему</h3>

            <div th:if="${param.error}" class="alert alert-danger">
                Неверный email или пароль
            </div>

            <form method="post" action="/login">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Пароль</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Войти</button>
            </form>

            <hr>

            <div class="text-center">
                <a href="/oauth2/authorization/google" class="btn btn-outline-dark">
                    <i class="bi bi-google"></i> Войти через Google
                </a>
            </div>

            <p class="text-center mt-3">
                Нет аккаунта? <a href="/register">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
