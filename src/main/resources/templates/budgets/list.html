<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Все бюджеты')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Все бюджеты</h1>
                <div>
                    <select onchange="window.location.href='/budgets?year=' + this.value"
                            class="form-select d-inline-block w-auto me-2">
                        <option th:each="y : ${years}" th:value="${y}" th:text="${y}"
                                th:selected="${y == selectedYear}"></option>
                    </select>
                    <a href="/budgets/create" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Создать бюджет
                    </a>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(budgets)}" class="alert alert-info">
                <i class="bi bi-info-circle"></i> Нет бюджетов за <span th:text="${selectedYear}">2024</span> год.
                <a href="/budgets/create" class="alert-link">Создать бюджет</a>
            </div>

            <div th:if="${!#lists.isEmpty(budgets)}" class="row">
                <div th:each="budget : ${budgets}" class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-header d-flex justify-content-between align-items-center">
                            <h5 class="mb-0" th:text="${budget.name}">Бюджет марта 2024</h5>
                            <span class="badge"
                                  th:classappend="${budget.status == 'ACTIVE'} ? 'bg-success' : (${budget.status == 'COMPLETED'} ? 'bg-secondary' : 'bg-warning')"
                                  th:text="${budget.status == 'ACTIVE'} ? 'Активен' : (${budget.status == 'COMPLETED'} ? 'Завершен' : 'Черновик')">Активен</span>
                        </div>
                        <div class="card-body">
                            <p class="text-muted" th:text="${budget.description}">Описание</p>

                            <div class="row mb-3">
                                <div class="col-6">
                                    <small class="text-muted">Период</small>
                                    <div th:text="${budget.periodMonth + '/' + budget.periodYear}">03/2024</div>
                                </div>
                                <div class="col-6">
                                    <small class="text-muted">Плановый доход</small>
                                    <div th:text="${#numbers.formatDecimal(budget.plannedIncome, 1, 2, 'COMMA')} + ' BYN'">
                                        1000.00 BYN
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <small class="text-muted">Общий прогресс</small>
                                <div class="progress mt-1">
                                    <div class="progress-bar"
                                         th:classappend="${budget.progressPercentage >= 100} ? 'bg-danger' : (${budget.progressPercentage >= 80} ? 'bg-warning' : 'bg-success')"
                                         th:style="'width: ' + ${budget.progressPercentage} + '%'"
                                         th:text="${budget.progressPercentage} + '%'">60%
                                    </div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between">
                                <div>
                                    <small class="text-muted">Потрачено</small>
                                    <div th:text="${#numbers.formatDecimal(budget.totalSpent, 1, 2, 'COMMA')} + ' BYN'">
                                        500.00 BYN
                                    </div>
                                </div>
                                <div>
                                    <small class="text-muted">Осталось</small>
                                    <div th:text="${#numbers.formatDecimal(budget.remainingBudget, 1, 2, 'COMMA')} + ' BYN'">
                                        500.00 BYN
                                    </div>
                                </div>
                            </div>

                            <hr>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/budgets/{id}/edit(id=${budget.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i> Редактировать
                                </a>
                                <form th:if="${budget.status == 'ACTIVE'}"
                                      th:action="@{/budgets/{id}/complete(id=${budget.id})}" method="post"
                                      style="display: inline;">
                                    <button type="submit" class="btn btn-sm btn-outline-success">
                                        <i class="bi bi-check-lg"></i> Завершить
                                    </button>
                                </form>
                                <form th:action="@{/budgets/{id}/delete(id=${budget.id})}" method="post"
                                      style="display: inline;">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Удалить бюджет?')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
