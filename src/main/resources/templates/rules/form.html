<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Редактирование правила')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2" th:text="${isEdit} ? 'Редактировать правило' : 'Новое правило'"></h1>
            </div>

            <form th:action="${isEdit} ? @{/rules/{id}/edit(id=${rule.id})} : @{/rules}"
                  th:object="${rule}" method="post" class="col-md-6">

                <div class="mb-3">
                    <label class="form-label">Поле для проверки</label>
                    <select th:field="*{field}" class="form-select" required>
                        <option th:each="f : ${fields}" th:value="${f}"
                                th:text="${f == 'description' ? 'Описание' : 'Сумма'}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Оператор</label>
                    <select th:field="*{operator}" class="form-select" required>
                        <option th:each="op : ${operators}"
                                th:value="${op}"
                                th:text="${op == 'CONTAINS' ? 'содержит' :
                                               (op == 'EQUALS' ? 'равно' :
                                               (op == 'GREATER_THAN' ? 'больше чем' :
                                               (op == 'LESS_THAN' ? 'меньше чем' :
                                               (op == 'STARTS_WITH' ? 'начинается с' : 'заканчивается на'))))}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Значение</label>
                    <input type="text" th:field="*{value}" class="form-control" required
                           placeholder="например: АЗС, 1000, супермаркет">
                </div>

                <div class="mb-3">
                    <label class="form-label">Категория</label>
                    <select th:field="*{categoryId}" class="form-select" required>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Приоритет (чем выше, тем раньше применяется)</label>
                    <input type="number" th:field="*{priority}" class="form-control" value="0">
                </div>

                <div class="mb-3 form-check">
                    <input type="checkbox" th:field="*{isActive}" class="form-check-input" id="isActive">
                    <label class="form-check-label" for="isActive">Правило активно</label>
                </div>

                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/rules" class="btn btn-secondary">Отмена</a>
            </form>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
