<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Finance Platform')}"></head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8 text-center">
            <h1 class="display-4">Управление личными финансами</h1>
            <p class="lead mt-4">Контролируйте доходы и расходы, планируйте бюджет, анализируйте траты</p>

            <div class="row mt-5">
                <div class="col-md-4">
                    <i class="bi bi-wallet2 display-1 text-primary"></i>
                    <h4 class="mt-3">Учет счетов</h4>
                </div>
                <div class="col-md-4">
                    <i class="bi bi-tags display-1 text-success"></i>
                    <h4 class="mt-3">Категоризация</h4>
                </div>
                <div class="col-md-4">
                    <i class="bi bi-pie-chart display-1 text-info"></i>
                    <h4 class="mt-3">Бюджетирование</h4>
                </div>
            </div>

            <div class="mt-5">
                <a href="/register" class="btn btn-primary btn-lg me-2">Регистрация</a>
                <a href="/login" class="btn btn-outline-primary btn-lg">Вход</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
