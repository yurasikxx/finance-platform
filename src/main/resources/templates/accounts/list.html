<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Счета')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Счета</h1>
                <a href="/accounts/add" class="btn btn-primary">
                    <i class="bi bi-plus-circle"></i> Добавить счет
                </a>
            </div>

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <h5 class="card-title">Общий баланс</h5>
                            <h3 th:text="${#numbers.formatDecimal(totalBalance, 1, 2, 'COMMA')} + ' BYN'">0.00 BYN</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div th:each="account : ${accounts}" class="col-md-4 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <h5 class="card-title" th:text="${account.name}">Наличные</h5>
                            <h6 class="card-subtitle mb-2 text-muted" th:text="${account.type.description}">Наличные</h6>
                            <h3 th:text="${#numbers.formatDecimal(account.currentBalance, 1, 2, 'COMMA')} + ' ' + ${account.currency}">
                                1000.00 BYN</h3>
                            <p class="card-text" th:text="${account.description}">Описание</p>
                            <a th:href="@{/accounts/{id}/edit(id=${account.id})}"
                               class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i> Редактировать
                            </a>
                            <form th:action="@{/accounts/{id}/delete(id=${account.id})}" method="post"
                                  style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Удалить счет?')">
                                    <i class="bi bi-trash"></i> Удалить
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
