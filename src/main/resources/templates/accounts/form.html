<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Редактирование счета')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2" th:text="${isEdit} ? 'Редактировать счет' : 'Новый счет'"></h1>
            </div>

            <form th:action="${isEdit} ? @{/accounts/{id}/edit(id=${account.id})} : @{/accounts}"
                  th:object="${account}" method="post" class="col-md-6">

                <div class="mb-3">
                    <label class="form-label">Название</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Тип счета</label>
                    <select th:field="*{type}" class="form-select" required>
                        <option value="CASH">Наличные</option>
                        <option value="BANK_CARD">Банковская карта</option>
                        <option value="ELECTRONIC_WALLET">Электронный кошелек</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Валюта</label>
                    <select th:field="*{currency}" class="form-select" required>
                        <option value="BYN">BYN</option>
                        <option value="USD">USD</option>
                        <option value="EUR">EUR</option>
                        <option value="RUB">RUB</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Начальный баланс</label>
                    <input type="number" step="0.01" th:field="*{initialBalance}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/accounts" class="btn btn-secondary">Отмена</a>
            </form>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
