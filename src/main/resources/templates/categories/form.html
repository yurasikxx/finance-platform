<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Редактирование категории')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2" th:text="${isEdit} ? 'Редактировать категорию' : 'Новая категория'"></h1>
            </div>

            <form th:action="${isEdit} ? @{/categories/{id}/edit(id=${category.id})} : @{/categories}"
                  th:object="${category}" method="post" class="col-md-6">

                <div class="mb-3">
                    <label class="form-label">Название</label>
                    <input type="text" th:field="*{name}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Тип</label>
                    <select th:field="*{type}" class="form-select" required>
                        <option th:each="type : ${types}"
                                th:value="${type}"
                                th:text="${type}">EXPENSE</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Цвет</label>
                    <input type="color" th:field="*{color}" class="form-control form-control-color">
                </div>

                <div class="mb-3">
                    <label class="form-label">Иконка</label>
                    <input type="text" th:field="*{icon}" class="form-control" placeholder="bi bi-cart">
                </div>

                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/categories" class="btn btn-secondary">Отмена</a>
            </form>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
