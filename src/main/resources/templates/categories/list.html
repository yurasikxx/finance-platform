<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Категории')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Категории</h1>
                <div>
                    <a href="/categories?type=INCOME" class="btn btn-sm btn-outline-success me-2"
                       th:classappend="${selectedType == 'INCOME'} ? 'active'">Доходы</a>
                    <a href="/categories?type=EXPENSE" class="btn btn-sm btn-outline-danger me-2"
                       th:classappend="${selectedType == 'EXPENSE'} ? 'active'">Расходы</a>
                    <a href="/categories" class="btn btn-sm btn-outline-secondary me-2"
                       th:classappend="${selectedType == null} ? 'active'">Все</a>
                    <a href="/categories/add" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Добавить категорию
                    </a>
                </div>
            </div>

            <div class="row">
                <div th:each="cat : ${categories}" class="col-md-3 mb-3">
                    <div class="card">
                        <div class="card-body">
                            <div class="d-flex align-items-center mb-2">
                                <div th:style="'width: 30px; height: 30px; background-color: ' + ${cat.color} + '; border-radius: 5px; margin-right: 10px;'"></div>
                                <h5 class="card-title mb-0" th:text="${cat.name}">Продукты</h5>
                            </div>
                            <p class="card-text text-muted" th:text="${cat.description}">Описание</p>
                            <span th:if="${cat.isDefault}" class="badge bg-info">По умолчанию</span>
                            <div class="mt-2">
                                <a th:href="@{/categories/{id}/edit(id=${cat.id})}"
                                   class="btn btn-sm btn-outline-primary">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:if="!${cat.isDefault}" th:action="@{/categories/{id}/delete(id=${cat.id})}"
                                      method="post" style="display: inline;">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Удалить категорию?')">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
