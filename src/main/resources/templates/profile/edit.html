<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Редактирование профиля')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Редактирование профиля</h1>
            </div>

            <form th:action="@{/profile/edit}" th:object="${user}" method="post" class="col-md-6">
                <div class="card mb-4">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Основная информация</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label class="form-label">Имя пользователя</label>
                            <input type="text" th:field="*{username}" class="form-control" required minlength="2">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" th:field="*{email}" class="form-control" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Валюта по умолчанию</label>
                            <select th:field="*{defaultCurrency}" class="form-select" required>
                                <option th:each="cur : ${currencies}"
                                        th:value="${cur}"
                                        th:text="${cur}">BYN
                                </option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-header bg-warning">
                        <h5 class="mb-0">Смена пароля</h5>
                    </div>
                    <div class="card-body">
                        <p class="text-muted small">Оставьте поля пустыми, если не хотите менять пароль</p>

                        <div class="mb-3">
                            <label class="form-label">Текущий пароль</label>
                            <input type="password" name="currentPassword" class="form-control">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Новый пароль</label>
                            <input type="password" name="newPassword" class="form-control" minlength="6">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Подтверждение пароля</label>
                            <input type="password" name="confirmPassword" class="form-control">
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <button type="submit" class="btn btn-primary">Сохранить изменения</button>
                    <a href="/profile" class="btn btn-secondary">Отмена</a>
                </div>
            </form>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
