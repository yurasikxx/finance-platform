<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Редактирование транзакции')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2" th:text="${isEdit} ? 'Редактировать транзакцию' : 'Новая транзакция'"></h1>
            </div>

            <form th:action="${isEdit} ? @{/transactions/{id}/edit(id=${transaction.id})} : @{/transactions}"
                  th:object="${transaction}" method="post" class="col-md-6">

                <div class="mb-3">
                    <label class="form-label">Тип транзакции</label>
                    <div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{type}" value="EXPENSE"
                                   id="typeExpense" checked>
                            <label class="form-check-label" for="typeExpense">Расход</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" th:field="*{type}" value="INCOME"
                                   id="typeIncome">
                            <label class="form-check-label" for="typeIncome">Доход</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Счет</label>
                    <select th:field="*{accountId}" class="form-select" required>
                        <option value="">Выберите счет</option>
                        <option th:each="acc : ${accounts}"
                                th:value="${acc.id}"
                                th:text="${acc.name + ' (' + acc.currency + ')'}"></option>
                    </select>
                </div>

                <div class="mb-3" id="categoryBlock">
                    <label class="form-label">Категория</label>
                    <select th:field="*{categoryId}" class="form-select" id="categorySelect">
                        <option value="">Без категории</option>
                        <option th:each="cat : ${expenseCategories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:attr="data-type='EXPENSE'"></option>
                        <option th:each="cat : ${incomeCategories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:attr="data-type='INCOME'" style="display:none;"></option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Сумма</label>
                    <input type="number" step="0.01" th:field="*{amount}" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Дата</label>
                    <input type="date"
                           name="transactionDate"
                           th:value="${transactionDateStr}"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <input type="text" th:field="*{description}" class="form-control">
                </div>

                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="/transactions" class="btn btn-secondary">Отмена</a>
            </form>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function updateCategories(selectedType) {
        const categorySelect = document.getElementById('categorySelect');
        const options = categorySelect.options;

        for (let i = 0; i < options.length; i++) {
            const option = options[i];
            const optionType = option.getAttribute('data-type');

            if (option.value === '') {
                option.style.display = 'block';
            } else if (optionType === selectedType) {
                option.style.display = 'block';
            } else {
                option.style.display = 'none';
            }
        }

        if (categorySelect.selectedOptions.length > 0) {
            const selectedOption = categorySelect.selectedOptions[0];
            if (selectedOption.style.display === 'none') {
                categorySelect.value = '';
            }
        }
    }

    document.querySelectorAll('input[name="type"]').forEach(radio => {
        radio.addEventListener('change', function() {
            updateCategories(this.value);
        });
    });

    window.addEventListener('load', function() {
        const selectedType = document.querySelector('input[name="type"]:checked');
        if (selectedType) {
            updateCategories(selectedType.value);
        } else {
            document.querySelector('input[name="type"][value="EXPENSE"]').checked = true;
            updateCategories('EXPENSE');
        }
    });
</script>
</body>
</html>
