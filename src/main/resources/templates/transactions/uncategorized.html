<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Некатегоризированные транзакции')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Требуют категоризации</h1>
            </div>

            <div th:if="${#lists.isEmpty(transactions)}" class="alert alert-info">
                <i class="bi bi-check-circle"></i> Все транзакции категоризированы!
            </div>

            <div th:if="${!#lists.isEmpty(transactions)}" class="table-responsive">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Счет</th>
                        <th>Описание</th>
                        <th class="text-end">Сумма</th>
                        <th>Категория</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tx : ${transactions}">
                        <td th:text="${tx.transactionDate}">2024-01-01</td>
                        <td th:text="${tx.accountName}">Карта</td>
                        <td th:text="${tx.description}">Описание</td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(tx.amount, 1, 2, 'COMMA')}">100.00</td>
                        <td>
                            <form th:action="@{/transactions/{id}/categorize(id=${tx.id})}" method="post"
                                  class="d-flex">
                                <select name="categoryId" class="form-select form-select-sm me-2" style="width: 150px;"
                                        required>
                                    <option value="">Выберите...</option>
                                    <option th:each="cat : ${categories}"
                                            th:value="${cat.id}"
                                            th:text="${cat.name}"></option>
                                </select>
                                <button type="submit" class="btn btn-sm btn-primary">
                                    <i class="bi bi-check-lg"></i>
                                </button>
                            </form>
                        </td>
                        <td>
                            <form th:action="@{/transactions/{id}/delete(id=${tx.id})}" method="post"
                                  style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Удалить транзакцию?')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
