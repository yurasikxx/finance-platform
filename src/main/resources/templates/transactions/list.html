<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Транзакции')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Транзакции</h1>
                <div>
                    <a href="/transactions/import" class="btn btn-success me-2">
                        <i class="bi bi-upload"></i> Импорт
                    </a>
                    <a href="/transactions/add" class="btn btn-primary">
                        <i class="bi bi-plus-circle"></i> Добавить
                    </a>
                </div>
            </div>

            <form method="get" class="row g-3 mb-4">
                <div class="col-md-3">
                    <select name="accountId" class="form-select">
                        <option value="">Все счета</option>
                        <option th:each="acc : ${accounts}"
                                th:value="${acc.id}"
                                th:text="${acc.name}"
                                th:selected="${acc.id == selectedAccountId}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <select name="categoryId" class="form-select">
                        <option value="">Все категории</option>
                        <option th:each="cat : ${categories}"
                                th:value="${cat.id}"
                                th:text="${cat.name}"
                                th:selected="${cat.id == selectedCategoryId}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <select name="type" class="form-select">
                        <option value="">Все типы</option>
                        <option value="INCOME" th:selected="${selectedType == 'INCOME'}">Доходы</option>
                        <option value="EXPENSE" th:selected="${selectedType == 'EXPENSE'}">Расходы</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100">Фильтровать</button>
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-striped">
                    <thead>
                    <tr>
                        <th>Дата</th>
                        <th>Тип</th>
                        <th>Категория</th>
                        <th>Счет</th>
                        <th>Описание</th>
                        <th class="text-end">Сумма</th>
                        <th>Действия</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="tx : ${transactions}">
                        <td th:text="${tx.transactionDate}">2024-01-01</td>
                        <td>
                            <span th:if="${tx.type == 'INCOME'}" class="badge bg-success">Доход</span>
                            <span th:if="${tx.type == 'EXPENSE'}" class="badge bg-danger">Расход</span>
                        </td>
                        <td th:text="${tx.categoryName}">Продукты</td>
                        <td th:text="${tx.accountName}">Карта</td>
                        <td th:text="${tx.description}">Описание</td>
                        <td class="text-end" th:text="${#numbers.formatDecimal(tx.amount, 1, 2, 'COMMA')}">100.00</td>
                        <td>
                            <a th:href="@{/transactions/{id}/edit(id=${tx.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form th:action="@{/transactions/{id}/delete(id=${tx.id})}" method="post"
                                  style="display: inline;">
                                <button type="submit" class="btn btn-sm btn-outline-danger"
                                        onclick="return confirm('Удалить транзакцию?')">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav aria-label="Page navigation">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/transactions(page=${currentPage - 1})}">Назад</a>
                    </li>
                    <li th:each="i : ${#numbers.sequence(0, totalPages-1)}" class="page-item"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/transactions(page=${i})}" th:text="${i+1}">1</a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages-1} ? 'disabled'">
                        <a class="page-link" th:href="@{/transactions(page=${currentPage + 1})}">Вперед</a>
                    </li>
                </ul>
            </nav>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
