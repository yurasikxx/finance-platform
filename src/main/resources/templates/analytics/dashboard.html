<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{layout/header :: header('Аналитика')}"></head>
<body>
<div th:replace="~{layout/navbar}"></div>

<div class="container-fluid">
    <div class="row">
        <div th:replace="~{layout/sidebar}"></div>

        <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
            <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                <h1 class="h2">Аналитика</h1>
                <form method="get" class="row g-3">
                    <div class="col-auto">
                        <input type="date" name="fromDate" class="form-control" th:value="${fromDate}">
                    </div>
                    <div class="col-auto">
                        <input type="date" name="toDate" class="form-control" th:value="${toDate}">
                    </div>
                    <div class="col-auto">
                        <button type="submit" class="btn btn-primary">Обновить</button>
                    </div>
                </form>
            </div>

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="card bg-success text-white">
                        <div class="card-body">
                            <h5 class="card-title">Доходы</h5>
                            <h3 th:text="${#numbers.formatDecimal(dashboard.totalIncome, 1, 2, 'COMMA')} + ' BYN'">
                                1000.00 BYN</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card bg-danger text-white">
                        <div class="card-body">
                            <h5 class="card-title">Расходы</h5>
                            <h3 th:text="${#numbers.formatDecimal(dashboard.totalExpense, 1, 2, 'COMMA')} + ' BYN'">
                                600.00 BYN</h3>
                        </div>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="card"
                         th:classappend="${dashboard.netBalance >= 0} ? 'bg-primary text-white' : 'bg-warning'">
                        <div class="card-body">
                            <h5 class="card-title">Баланс</h5>
                            <h3 th:text="${#numbers.formatDecimal(dashboard.netBalance, 1, 2, 'COMMA')} + ' BYN'">400.00
                                BYN</h3>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <i class="bi bi-pie-chart"></i> Структура расходов
                        </div>
                        <div class="card-body">
                            <canvas id="expenseChart" style="height: 300px;"></canvas>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <i class="bi bi-graph-up"></i> Динамика доходов/расходов
                        </div>
                        <div class="card-body">
                            <canvas id="trendChart" style="height: 300px;"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <i class="bi bi-arrow-left-right"></i> Сравнение с прошлым периодом
                        </div>
                        <div class="card-body">
                            <table class="table">
                                <tr>
                                    <th></th>
                                    <th>Текущий период</th>
                                    <th th:text="${dashboard.previousPeriod.periodName}">Прошлый месяц</th>
                                    <th>Изменение</th>
                                </tr>
                                <tr>
                                    <td>Доходы</td>
                                    <td th:text="${#numbers.formatDecimal(dashboard.totalIncome, 1, 2, 'COMMA')} + ' BYN'">
                                        1000
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(dashboard.previousPeriod.income, 1, 2, 'COMMA')} + ' BYN'">
                                        900
                                    </td>
                                    <td>
                                            <span th:if="${dashboard.previousPeriod.incomeChange >= 0}"
                                                  class="text-success">
                                                +<span th:text="${dashboard.previousPeriod.incomeChange} + '%'"></span>
                                            </span>
                                        <span th:if="${dashboard.previousPeriod.incomeChange < 0}" class="text-danger">
                                                <span th:text="${dashboard.previousPeriod.incomeChange} + '%'"></span>
                                            </span>
                                    </td>
                                </tr>
                                <tr>
                                    <td>Расходы</td>
                                    <td th:text="${#numbers.formatDecimal(dashboard.totalExpense, 1, 2, 'COMMA')} + ' BYN'">
                                        600
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(dashboard.previousPeriod.expense, 1, 2, 'COMMA')} + ' BYN'">
                                        500
                                    </td>
                                    <td>
                                            <span th:if="${dashboard.previousPeriod.expenseChange <= 0}"
                                                  class="text-success">
                                                <span th:text="${dashboard.previousPeriod.expenseChange} + '%'"></span>
                                            </span>
                                        <span th:if="${dashboard.previousPeriod.expenseChange > 0}" class="text-danger">
                                                +<span th:text="${dashboard.previousPeriod.expenseChange} + '%'"></span>
                                            </span>
                                    </td>
                                </tr>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="col-md-6 mb-4">
                    <div class="card">
                        <div class="card-header">
                            <i class="bi bi-calendar"></i> Топ-5 категорий расходов
                        </div>
                        <div class="card-body">
                            <table class="table">
                                <thead>
                                <tr>
                                    <th>Категория</th>
                                    <th>Сумма</th>
                                    <th>Доля</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="cat : ${expenseBreakdown}" th:if="${catStat.count <= 5}">
                                    <td>
                                        <div th:style="'width: 20px; height: 20px; background-color: ' + ${cat.categoryColor} + '; display: inline-block; border-radius: 3px; margin-right: 8px;'"></div>
                                        <span th:text="${cat.categoryName}">Продукты</span>
                                    </td>
                                    <td th:text="${#numbers.formatDecimal(cat.amount, 1, 2, 'COMMA')} + ' BYN'">500</td>
                                    <td th:text="${cat.percentage} + '%'">30%</td>
                                </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    const expenseCtx = document.getElementById('expenseChart').getContext('2d');
    new Chart(expenseCtx, {
        type: 'pie',
        data: {
            labels: /*[[${expenseLabels}]]*/ [],
            datasets: [{
                data: /*[[${expenseData}]]*/ [],
                backgroundColor: [
                    '#dc3545', '#fd7e14', '#ffc107', '#28a745', '#17a2b8',
                    '#6f42c1', '#e83e8c', '#20c997', '#007bff', '#6c757d'
                ]
            }]
        }
    });

    const trendCtx = document.getElementById('trendChart').getContext('2d');
    new Chart(trendCtx, {
        type: 'line',
        data: {
            labels: /*[[${dailyLabels}]]*/ [],
            datasets: [
                {
                    label: 'Доходы',
                    data: /*[[${dailyIncome}]]*/ [],
                    borderColor: '#28a745',
                    tension: 0.1
                },
                {
                    label: 'Расходы',
                    data: /*[[${dailyExpense}]]*/ [],
                    borderColor: '#dc3545',
                    tension: 0.1
                }
            ]
        },
        options: {
            scales: {
                y: {
                    beginAtZero: true
                }
            }
        }
    });
</script>
</body>
</html>
